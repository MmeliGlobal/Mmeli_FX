<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmeli_FX - Signal History</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            padding: 16px;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #161b22; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

        .navbar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .navbar-brand {
            font-size: 16px;
            font-weight: 700;
            color: #58a6ff;
            text-decoration: none;
        }

        .navbar-brand span {
            color: #8b949e;
            font-weight: 400;
            font-size: 11px;
            margin-left: 4px;
        }

        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .nav-item {
            padding: 4px 12px;
            border-radius: 8px;
            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav-item:hover {
            color: #f0f6fc;
            background: #1c2333;
        }

        .nav-item.active {
            color: #f0f6fc;
            background: #1c2333;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            background: #1c2333;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .btn-icon:hover {
            border-color: #58a6ff;
            color: #f0f6fc;
        }

        .btn-danger {
            background: #da3633;
            border: 1px solid #da3633;
            color: #fff;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            opacity: 0.8;
        }

        /* ============================================
           STATS GRID
           ============================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 14px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
        }

        .stat-card .value.green { color: #3fb950; }
        .stat-card .value.red { color: #f85149; }
        .stat-card .value.yellow { color: #d29922; }
        .stat-card .value.blue { color: #58a6ff; }

        .stat-card .label {
            font-size: 11px;
            color: #8b949e;
            margin-top: 2px;
        }

        /* ============================================
           SIGNALS TABLE
           ============================================ */
        .signals-table-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
        }

        .signals-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        .signals-table th {
            background: #1c2333;
            padding: 8px 12px;
            text-align: left;
            color: #8b949e;
            font-weight: 500;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .signals-table td {
            padding: 6px 12px;
            border-bottom: 1px solid #21262d;
        }

        .signals-table tr:hover td {
            background: #1c2333;
        }

        .status-badge {
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-badge.pending {
            background: #d2992222;
            color: #d29922;
            border: 1px solid #d29922;
        }

        .status-badge.hit_tp {
            background: #3fb95022;
            color: #3fb950;
            border: 1px solid #3fb950;
        }

        .status-badge.hit_sl {
            background: #f8514922;
            color: #f85149;
            border: 1px solid #f85149;
        }

        .status-badge.closed {
            background: #8b949e22;
            color: #8b949e;
            border: 1px solid #8b949e;
        }

        .action-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 10px;
        }

        .action-badge.buy {
            background: #3fb950;
            color: #000;
        }

        .action-badge.sell {
            background: #f85149;
            color: #fff;
        }

        .no-signals {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .table-wrapper {
            max-height: 500px;
            overflow-y: auto;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .signals-table th,
            .signals-table td {
                font-size: 10px;
                padding: 4px 6px;
            }
            .navbar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
            .navbar-menu { flex-wrap: wrap; }
            body { padding: 8px; }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-brand">📊 Mmeli_FX <span>Signal History</span></div>
        <div class="navbar-menu">
            <a href="/" class="nav-item">📊 Charts</a>
            <a href="/signals" class="nav-item">🔔 Signals</a>
            <a href="/history" class="nav-item active">📜 History</a>
            <a href="/rules" class="nav-item">⚙️ Rules</a>
        </div>
        <div class="nav-right">
            <button class="btn-danger" onclick="clearHistory()">🗑 Clear All</button>
            <button class="btn-icon" onclick="refreshHistory()">⟳ Refresh</button>
        </div>
    </nav>

    <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
            <div class="value blue" id="stat-total">0</div>
            <div class="label">Total Signals</div>
        </div>
        <div class="stat-card">
            <div class="value yellow" id="stat-pending">0</div>
            <div class="label">Pending</div>
        </div>
        <div class="stat-card">
            <div class="value green" id="stat-wins">0</div>
            <div class="label">Wins (Hit TP)</div>
        </div>
        <div class="stat-card">
            <div class="value red" id="stat-losses">0</div>
            <div class="label">Losses (Hit SL)</div>
        </div>
        <div class="stat-card">
            <div class="value green" id="stat-winrate">0%</div>
            <div class="label">Win Rate</div>
        </div>
        <div class="stat-card">
            <div class="value yellow" id="stat-avgrr">0.0</div>
            <div class="label">Avg Risk:Reward</div>
        </div>
        <div class="stat-card">
            <div class="value blue" id="stat-bestpattern">-</div>
            <div class="label">Best Pattern</div>
        </div>
        <div class="stat-card">
            <div class="value blue" id="stat-bestsymbol">-</div>
            <div class="label">Best Symbol</div>
        </div>
    </div>

    <div class="signals-table-container">
        <div class="table-wrapper">
            <table class="signals-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Time</th>
                        <th>Symbol</th>
                        <th>Action</th>
                        <th>Pattern</th>
                        <th>Entry</th>
                        <th>SL</th>
                        <th>TP</th>
                        <th>RR</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="signals-body">
                    <tr><td colspan="10" class="no-signals">⏳ Loading signal history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function loadHistory() {
            fetch('/api/signal_history?limit=100')
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        updateStats(data.statistics);
                        updateTable(data.signals);
                    } else {
                        document.getElementById('signals-body').innerHTML =
                            '<tr><td colspan="10" class="no-signals">❌ Error loading history</td></tr>';
                    }
                })
                .catch(err => {
                    document.getElementById('signals-body').innerHTML =
                        '<tr><td colspan="10" class="no-signals">❌ Error loading history</td></tr>';
                });
        }

        function updateStats(stats) {
            document.getElementById('stat-total').textContent = stats.total || 0;
            document.getElementById('stat-pending').textContent = stats.pending || 0;
            document.getElementById('stat-wins').textContent = stats.hit_tp || 0;
            document.getElementById('stat-losses').textContent = stats.hit_sl || 0;
            document.getElementById('stat-winrate').textContent = (stats.win_rate || 0) + '%';
            document.getElementById('stat-avgrr').textContent = stats.avg_rr || '0.0';
            document.getElementById('stat-bestpattern').textContent = stats.best_pattern || '-';
            document.getElementById('stat-bestsymbol').textContent = stats.best_symbol || '-';
        }

        function updateTable(signals) {
            const tbody = document.getElementById('signals-body');

            if (!signals || signals.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="no-signals">📭 No signal history yet. Signals will appear here when generated.</td></tr>';
                return;
            }

            let html = '';
            signals.forEach((s, i) => {
                const actionClass = s.action ? s.action.toLowerCase() : '';
                const statusClass = (s.status || 'PENDING').toLowerCase().replace('_', '');
                const rr = s.risk_reward || 'N/A';
                const entry = s.entry ? s.entry.toFixed(5) : 'N/A';
                const sl = s.stop_loss ? s.stop_loss.toFixed(5) : 'N/A';
                const tp = s.take_profit ? s.take_profit.toFixed(5) : 'N/A';
                const time = s.created_at ? new Date(s.created_at).toLocaleString() : 'N/A';

                html += `
                    <tr>
                        <td>${i + 1}</td>
                        <td style="font-size:10px;color:#8b949e;">${time}</td>
                        <td><strong>${s.symbol || 'N/A'}</strong></td>
                        <td><span class="action-badge ${actionClass}">${s.action || 'N/A'}</span></td>
                        <td style="color:#8b949e;">${s.pattern || 'N/A'}</td>
                        <td>${entry}</td>
                        <td>${sl}</td>
                        <td>${tp}</td>
                        <td style="color:#d29922;">1:${rr}</td>
                        <td><span class="status-badge ${statusClass}">${s.status || 'PENDING'}</span></td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        function refreshHistory() {
            loadHistory();
        }

        function clearHistory() {
            if (confirm('⚠️ Are you sure you want to clear ALL signal history?')) {
                fetch('/api/signal_history/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                })
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'success') {
                        loadHistory();
                    }
                });
            }
        }

        // Load on page load
        loadHistory();
        setInterval(loadHistory, 30000);
    </script>
</body>
</html>
