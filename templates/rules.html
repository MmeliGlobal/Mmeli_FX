<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mmeli_FX - Strategy Rules</title>
    <style>
        /* ============================================
           CSS VARIABLES & THEMING
           ============================================ */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #1c2333;
            --bg-input: #0d1117;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --text-muted: #484f58;
            --border-color: #30363d;
            --border-light: #21262d;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
            --accent-purple: #bc8cff;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 8px;
            --transition: all 0.3s ease;
        }

        [data-theme="light"] {
            --bg-primary: #f0f6fc;
            --bg-secondary: #ffffff;
            --bg-card: #f6f8fa;
            --text-primary: #1f2328;
            --text-secondary: #656d76;
            --text-muted: #8b949e;
            --border-color: #d0d7de;
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: var(--transition);
            min-height: 100vh;
            padding: 16px;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

        /* ============================================
           NAVIGATION BAR
           ============================================ */
        .navbar {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0 16px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .navbar-brand {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-blue);
            text-decoration: none;
            white-space: nowrap;
        }

        .navbar-brand span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 11px;
            margin-left: 4px;
        }

        .navbar-menu {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: var(--radius);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .nav-item:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .nav-item.active {
            color: var(--text-primary);
            background: var(--bg-card);
        }

        .nav-item .badge {
            background: var(--accent-red);
            color: #fff;
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 10px;
            margin-left: 2px;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-icon:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        /* ============================================
           RULES PAGE
           ============================================ */
        .rules-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .rules-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .rules-header h1 {
            font-size: 20px;
            color: var(--text-primary);
        }

        .rules-header h1 span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 14px;
            margin-left: 8px;
        }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        .btn-success {
            background: var(--accent-green);
            color: #000;
        }

        .btn-success:hover {
            opacity: 0.85;
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        .btn-danger:hover {
            opacity: 0.85;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        /* ============================================
           ADD RULE FORM
           ============================================ */
        .add-rule-form {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 16px;
        }

        .add-rule-form h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            grid-column: span 4;
        }

        @media (max-width: 768px) {
            .form-actions {
                grid-column: span 2;
            }
        }

        @media (max-width: 480px) {
            .form-actions {
                grid-column: span 1;
            }
        }

        /* ============================================
           RULES LIST
           ============================================ */
        .rules-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .rule-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition);
        }

        .rule-card:hover {
            border-color: var(--accent-blue);
        }

        .rule-card.disabled {
            opacity: 0.4;
        }

        .rule-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rule-info .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .rule-info .details {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .rule-info .details strong {
            color: var(--text-primary);
        }

        .rule-info .rule-description {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-style: italic;
        }

        .rule-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .rule-status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .rule-status.enabled {
            background: var(--accent-green);
            color: #000;
        }

        .rule-status.disabled {
            background: var(--text-muted);
            color: #fff;
        }

        .rule-type {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .rule-type.buy {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .rule-type.sell {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .rule-type.both {
            border-color: var(--accent-yellow);
            color: var(--accent-yellow);
        }

        .no-rules {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ============================================
           CATEGORY LABELS
           ============================================ */
        .category-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            padding: 8px 0 4px 0;
            border-bottom: 1px solid var(--border-color);
            margin-top: 8px;
        }

        .category-label:first-child {
            margin-top: 0;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 600px) {
            .rule-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .rule-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }
            .rules-header {
                flex-direction: column;
                align-items: flex-start;
            }
            body { padding: 8px; }
            .navbar { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
            .navbar-menu { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    NAVIGATION BAR
    ========================================== -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="/" class="navbar-brand">
                📊 Mmeli_FX <span>Strategy Rules</span>
            </a>
            <div class="navbar-menu">
                <a href="/" class="nav-item">📊 Charts</a>
                <a href="/signals" class="nav-item">🔔 Signals <span class="badge" id="signal-badge">0</span></a>
                <a href="/rules" class="nav-item active">⚙️ Rules</a>
<a href="/history" class="nav-item">📜 History</a>
            </div>
        </div>

        <div class="nav-right">
            <button class="btn-icon" onclick="toggleTheme()">🌓</button>
            <span class="btn-icon" style="font-size:10px;color:var(--accent-green);">🟢 Online</span>
        </div>
    </nav>

    <!-- ==========================================
    RULES CONTENT
    ========================================== -->
    <div class="rules-container">

        <div class="rules-header">
            <h1>⚙️ Strategy Rules <span>Manage your trading strategies</span></h1>
            <button class="btn btn-primary" onclick="toggleForm()">➕ Add New Rule</button>
        </div>

        <!-- Add Rule Form -->
        <div class="add-rule-form" id="add-rule-form" style="display:none;">
            <h3>📝 Create New Strategy Rule</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Rule Name *</label>
                    <input type="text" id="rule-name" placeholder="e.g., Pin Bar Reversal">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="rule-category">
                        <option value="Reversal">Reversal</option>
                        <option value="Continuation">Continuation</option>
                        <option value="SMC">Smart Money Concepts</option>
                        <option value="Chart Patterns">Chart Patterns</option>
                        <option value="Custom">Custom</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Signal Type</label>
                    <select id="rule-signal-type">
                        <option value="BOTH">Both (BUY & SELL)</option>
                        <option value="BUY">BUY Only</option>
                        <option value="SELL">SELL Only</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Indicator</label>
                    <input type="text" id="rule-indicator" placeholder="e.g., Pin Bar Candle">
                </div>
                <div class="form-group">
                    <label>Confirmation</label>
                    <input type="text" id="rule-confirmation" placeholder="e.g., Support/Resistance Level">
                </div>
                <div class="form-group" style="grid-column: span 3;">
                    <label>Rule Description</label>
                    <input type="text" id="rule-description" placeholder="e.g., When a Pin Bar forms at Support/Resistance with 1:2+ RR">
                </div>
                <div class="form-actions">
                    <button class="btn btn-success" onclick="createRule()">✅ Add Rule</button>
                    <button class="btn btn-outline" onclick="toggleForm()">❌ Cancel</button>
                </div>
            </div>
        </div>

        <!-- Rules List -->
        <div id="rules-container">
            <div class="loading">⏳ Loading rules...</div>
        </div>
    </div>

    <script>
        // ============================================
        // STATE
        // ============================================
        let currentTheme = 'dark';

        // ============================================
        // THEME TOGGLE
        // ============================================
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            currentTheme = next;
        }

        // ============================================
        // TOGGLE FORM
        // ============================================
        function toggleForm() {
            const form = document.getElementById('add-rule-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        // ============================================
        // LOAD RULES
        // ============================================
        function loadRules() {
            fetch('/api/rules')
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById('rules-container');
                    const rules = data.rules || [];

                    if (rules.length === 0) {
                        container.innerHTML = '<div class="no-rules">📭 No strategy rules created yet. Click "Add New Rule" to create one.</div>';
                        return;
                    }

                    // Group by category
                    const categories = {};
                    rules.forEach(r => {
                        const cat = r.category || 'Custom';
                        if (!categories[cat]) categories[cat] = [];
                        categories[cat].push(r);
                    });

                    let html = '<div class="rules-list">';
                    Object.keys(categories).forEach(cat => {
                        html += `<div class="category-label">📁 ${cat}</div>`;
                        categories[cat].forEach(r => {
                            const enabled = r.enabled !== false;
                            const signalType = r.signal_type || 'BOTH';
                            const signalClass = signalType.toLowerCase();
                            html += `
                                <div class="rule-card ${enabled ? '' : 'disabled'}" data-id="${r.id}">
                                    <div class="rule-info">
                                        <div class="name">${r.name || 'Unnamed Rule'}</div>
                                        <div class="details">
                                            <strong>Indicator:</strong> ${r.indicator || 'N/A'} &nbsp;|&nbsp;
                                            <strong>Confirmation:</strong> ${r.confirmation || 'N/A'}
                                        </div>
                                        <div class="rule-description">📋 ${r.rule || 'No description'}</div>
                                    </div>
                                    <div class="rule-actions">
                                        <span class="rule-type ${signalClass}">${signalType}</span>
                                        <span class="rule-status ${enabled ? 'enabled' : 'disabled'}">${enabled ? '✅ ON' : '❌ OFF'}</span>
                                        <button class="btn btn-outline toggle-rule" data-id="${r.id}" style="font-size:10px;padding:3px 10px;">Toggle</button>
                                        <button class="btn btn-danger delete-rule" data-id="${r.id}" style="font-size:10px;padding:3px 10px;">🗑</button>
                                    </div>
                                </div>
                            `;
                        });
                    });
                    html += '</div>';
                    container.innerHTML = html;
                })
                .catch(err => {
                    document.getElementById('rules-container').innerHTML = '<div class="no-rules">❌ Error loading rules</div>';
                });
        }

        // ============================================
        // CREATE RULE
        // ============================================
        function createRule() {
            const rule = {
                name: document.getElementById('rule-name').value,
                category: document.getElementById('rule-category').value,
                signal_type: document.getElementById('rule-signal-type').value,
                indicator: document.getElementById('rule-indicator').value,
                confirmation: document.getElementById('rule-confirmation').value,
                rule: document.getElementById('rule-description').value,
                enabled: true
            };

            if (!rule.name) {
                alert('Please enter a rule name');
                return;
            }

            fetch('/api/rules/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(rule)
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('rule-name').value = '';
                    document.getElementById('rule-indicator').value = '';
                    document.getElementById('rule-confirmation').value = '';
                    document.getElementById('rule-description').value = '';
                    toggleForm();
                    loadRules();
                } else {
                    alert('Failed to create rule: ' + data.message);
                }
            })
            .catch(err => {
                alert('Error: ' + err.message);
            });
        }

        // ============================================
        // TOGGLE & DELETE (Event Delegation)
        // ============================================
        document.getElementById('rules-container').addEventListener('click', function(e) {
            const target = e.target;

            if (target.classList.contains('toggle-rule')) {
                const id = target.dataset.id;
                fetch(`/api/rules/toggle/${id}`, { method: 'POST' })
                    .then(() => loadRules());
            }

            if (target.classList.contains('delete-rule')) {
                if (confirm('Delete this strategy rule?')) {
                    const id = target.dataset.id;
                    fetch(`/api/rules/delete/${id}`, { method: 'DELETE' })
                        .then(() => loadRules());
                }
            }
        });

        // ============================================
        // LOAD SIGNAL BADGE
        // ============================================
        function loadSignalBadge() {
            fetch('/api/signals')
                .then(r => r.json())
                .then(data => {
                    const count = (data.signals || []).length;
                    document.getElementById('signal-badge').textContent = count;
                })
                .catch(() => {});
        }

        // ============================================
        // INIT
        // ============================================
        loadRules();
        loadSignalBadge();
        setInterval(loadSignalBadge, 30000);
    </script>
</body>
</html>
